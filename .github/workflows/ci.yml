name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m ruff check .
      - run: python -m pytest
      - name: Vulnerability, license and SBOM evidence
        run: |
          python -m pip install pip-audit cyclonedx-bom pip-licenses
          pip-audit -r requirements.lock
          pip-licenses --fail-on="GPL;AGPL" --format=json --output-file=licenses-api.json
          cyclonedx-py requirements requirements.lock -o sbom-api.json
      - uses: actions/upload-artifact@v4
        with:
          name: api-supply-chain-evidence
          path: |
            apps/api/sbom-api.json
            apps/api/licenses-api.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx --yes license-checker --failOn="GPL;AGPL" --json > licenses-web.json
      - run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom-web.json
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-supply-chain-evidence
          path: |
            apps/web/sbom-web.json
            apps/web/licenses-web.json
