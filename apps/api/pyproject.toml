[project]
name = "money-api"
version = "0.1.0"
description = "个人基金仪表盘后端 API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.26",
    "cvxpy>=1.6,<2",
    "lxml>=5.0",
    "akshare>=1.17,<2",
    # 研究数据仓库（DuckDB + Parquet 分区目录）
    "duckdb>=1.0",
    "pyarrow>=14.0",
    "alembic>=1.13",
    "cryptography>=43,<47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.12",
    "hypothesis>=6.100,<7",
]
# PostgreSQL 部署时安装: pip install "money-api[postgres]"
postgres = [
    "psycopg[binary]>=3.1",
]
ml = [
    "xgboost>=2.1,<4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
